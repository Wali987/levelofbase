        .screen-content.active { display: flex; }
        
        /* Header & Navbar */
        header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }

        .wallet-badge { background: #0f172a; padding: 5px 12px; border-radius: 20px; border: 1px solid #38bdf8; font-weight: 600; color: #38bdf8; }
        
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: none; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; z-index: 100; }

        .nav-item { text-align: center; color: #94a3b8; cursor: pointer; font-size: 12px; }

        .nav-item i { display: block; font-size: 18px; margin-bottom: 3px; }

        /* Welcome / Auth Screen */
        #screen-welcome { padding: 30px 20px; justify-content: center; align-items: center; text-align: center; }
        .auth-box { background: #1e293b; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #334155; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        .auth-tab { flex: 1; padding: 10px; background: #0f172a; color: #94a3b8; cursor: pointer; border: none; font-weight: bold; }
        .auth-tab.active-tab { background: #38bdf8; color: #0f172a; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .btn-main { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }

        /* Lobby / Games Grid */
        .lobby-container { padding: 15px; }
        .section-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; color: #e2e8f0; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .game-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; cursor: pointer; transition: transform 0.2s; }
        .game-card:active { transform: scale(0.97); }
        .game-thumb { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #fff; }
        .game-info { padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .game-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .play-now-sm { background: #38bdf8; color: #0f172a; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }

        .modal-header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }

        .modal-body { flex: 1; position: relative; }

        .wallet-actions { display: flex; gap: 10px; padding: 0 15px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-withdraw { background: #10b981; color: #fff; }
        .btn-spin { background: #f59e0b; color: #fff; }

            { title: "Tennis Open", url: "https://html5.gamemonetize.co/1zu28yuo42m9q6w3qm8q9v2t1nz9avyi/", icon: "fa-table-tennis-paddle-ball", bg: "linear-gradient(135deg, #11998e, #38ef7d)" },
            { title: "Boxing Slam", url: "https://html5.gamemonetize.co/i0ls0z1jfyvauimh5g7xlm26r0hjidm0/", icon: "fa-hand-fist", bg: "linear-gradient(135deg, #ff416c, #ff4b2b)" },
            { title: "Wrestling Mania", url: "https://html5.gamemonetize.co/hgjkmdxslgkbajmj6gw34e3n0mg5sols/", icon: "fa-people-arrows", bg: "linear-gradient(135deg, #2c3e50, #3498db)" },
            { title: "Farming Simulator", url: "https://html5.gamemonetize.co/7ti5d19e7syonvvsmruhb36ph9mmzihp/", icon: "fa-wheat-awn", bg: "linear-gradient(135deg, #f2994a, #f2c94c)" },
            { title: "Ultimate Boss Fight", url: "https://html5.gamemonetize.co/u1nspb6d6k05iahz4oc3qtbl0my3cwfi/", icon: "fa-dragon", bg: "linear-gradient(135deg, #833ab4, #fd1d1d)" }
        ];

        function initGamesGrid() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            games.forEach((game, index) => {
                grid.innerHTML += `
                    <div class="game-card" onclick="launchGame(${index})">
                        <div class="game-thumb" style="background: ${game.bg}">
                            <i class="fa-solid ${game.icon}"></i>
                        </div>
                        <div class="game-info">
                            <span class="game-name">${game.title}</span>
                            <button class="play-now-sm">Play</button>
                        </div>
                    </div>
                `;
            });
        }

        function switchAuthMode(mode) {
            authMode = mode;
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegisterBtn');
            const submitBtn = document.getElementById('authSubmitBtn');
            const extraFields = document.getElementById('registerExtraFields');

            if (mode === 'login') {
                loginBtn.classList.add('active-tab');
                regBtn.classList.remove('active-tab');
                submitBtn.innerText = 'Login';
                extraFields.style.display = 'none';
            } else {
                regBtn.classList.add('active-tab');
                loginBtn.classList.remove('active-tab');
                submitBtn.innerText = 'Register & Get ₹20 Bonus';
                extraFields.style.display = 'block';
            }
        }

        function showScreen(screenId, navElement) {
            document.querySelectorAll('.screen-content').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (navElement) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                navElement.classList.add('active');
            }
        }

        function handleAuth() {
            const phone = document.getElementById('phoneInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const refCode = document.getElementById('refInput').value.trim();

            if (!phone || !pass) {
                alert('Please enter both phone number and password.');
                return;
            }

            const userRef = db.collection('users').doc(phone);
            userRef.get().then((doc) => {
                if (authMode === 'login') {
                    if (!doc.exists) {
                        alert('Account not found! Please register first.');
                        return;
                    }
                    const data = doc.data();
                    if (data.password !== pass) {
                        alert('Incorrect password!');
                        return;
                    }
                    loginSuccess(data);
                } else {
                    if (doc.exists) {
                        alert('Phone number already registered! Please login.');
                        return;
                    }
                    const randomId = '#' + Math.floor(100000 + Math.random() * 900000);
                    const myRefCode = 'NEXUS' + Math.floor(1000 + Math.random() * 9000);
                    const initialBonus = 20.00;

                    const newUser = {
                        phone: phone,
                        password: pass,
                        playerId: randomId,
                        nickname: 'Gamer_' + phone.slice(-4),
                        balance: initialBonus,
                        referralCode: myRefCode,
                        referredBy: refCode || '',
                        referralsCount: 0,
                        referralEarnings: 0.00
                    };

                    userRef.set(newUser).then(() => {
                        loginSuccess(newUser);
                    });
                }
            }).catch(error => {
                console.error("Auth error:", error);
                alert("Authentication error occurred.");
            });
        }

        function loginSuccess(userData) {
            currentUser = userData;
            userBalance = userData.balance;
            document.getElementById('balanceDisplay').innerText = `₹${userBalance.toFixed(2)}`;
            document.getElementById('walletBalanceDisplay').innerText = `₹${userBalance.toFixed(2)}`;
            document.getElementById('accountPhone').innerText = `+91 ${userData.phone}`;
            document.getElementById('myReferralCode').innerText = userData.referralCode || 'NEXUS1234';

            document.getElementById('screen-welcome').classList.remove('active');
            document.getElementById('screen-lobby').classList.add('active');
            document.getElementById('mainBottomNav').classList.add('active-nav');
            initGamesGrid();
        }

        function launchGame(index) {
            const game = games[index];
            document.getElementById('modalGameTitle').innerText = game.title;
            document.getElementById('gameIframe').src = game.url;
            document.getElementById('gameModal').style.display = 'flex';
            startSessionTimer();
        }

        function closeGameModal() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameIframe').src = '';
            clearInterval(gameTimerInterval);
        }

        function startSessionTimer() {
            timeLeft = 1800;
            clearInterval(gameTimerInterval);
            
            gameTimerInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timerText').innerText = `Time Active: ${mins}:${secs < 10 ? '0' : ''}${secs} left to complete session`;
                
                if (timeLeft <= 0) {
                    clearInterval(gameTimerInterval);
                    alert('Session completed! Reward verified.');
                    closeGameModal();
                }
            }, 1000);
        }

        function handleWithdrawRequest() {
            if (userBalance < 200) {
                alert('Minimum withdrawal amount is ₹200.00. Keep playing to earn more!');
                return;
            }
            alert('Withdrawal request submitted successfully! Funds will be credited within 24 hours.');
        }

        function spinLuckyWheel() {
            const reward = (Math.random() * 5).toFixed(2);
            userBalance += parseFloat(reward);
            document.getElementById('balanceDisplay').innerText = `₹${userBalance.toFixed(2)}`;
            document.getElementById('walletBalanceDisplay').innerText = `₹${userBalance.toFixed(2)}`;
            document.getElementById('spinResultBox').innerText = `🎉 You Won ₹${reward} Bonus!`;
            
            if (currentUser) {
                db.collection('users').doc(currentUser.phone).update({ balance: userBalance });
            }
        }

        function openChatModal() { document.getElementById('chatModal').style.display = 'flex'; }
        function closeChatModal() { document.getElementById('chatModal').style.display = 'none'; }
        
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const body = document.getElementById('chatBody');
            if (!input.value.trim()) return;

            body.innerHTML += `<div class="chat-bubble user">${input.value}</div>`;
            const userMsg = input.value;
            input.value = '';

            setTimeout(() => {
                let reply = "Aapke sawaal ke liye shukriya! Minimum withdrawal ₹200 hai, aur Signup par ₹20 milta hai.";
                if (userMsg.toLowerCase().includes('withdraw')) reply = "Withdrawal request 24 hours mein process hoti hai. Min limit ₹200 hai.";
                body.innerHTML += `<div class="chat-bubble bot">${reply}</div>`;
                body.scrollTop = body.scrollHeight;
            }, 1000);
        }

        function logoutUser() {
            currentUser = null;
            location.reload();
        }

        function copyReferralCode() {
            const code = document.getElementById('myReferralCode').innerText;
            navigator.clipboard.writeText(code);
            alert('Referral code copied to clipboard!');
        }
    </script>
</body>
</html>
