<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusArcade - Ultimate Gaming Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0b10;
            --bg-card: #131622;
            --accent-neon: #00f0ff;
            --accent-purple: #7000ff;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(19, 22, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--glow);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            position: relative;
            width: 320px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(10, 11, 16, 0.6);
            border: 1px solid rgba(139, 155, 180, 0.3);
            border-radius: 30px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }

        .search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .main-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(112, 0, 255, 0.25), rgba(0, 240, 255, 0.15));
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-content h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            margin-bottom: 10px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .hero-content p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
        }

        .stats-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--accent-neon);
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            box-shadow: var(--glow);
        }

        .stats-badge span {
            display: block;
            font-size: 24px;
            color: var(--accent-neon);
            font-weight: 700;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-neon);
            padding-left: 12px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(139, 155, 180, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }

        .game-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #161b2e, #202640);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .game-thumbnail::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
        }

        .game-thumbnail i {
            font-size: 42px;
            color: var(--accent-neon);
            z-index: 1;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .game-card:hover .game-thumbnail i {
            transform: scale(1.15) rotate(5deg);
            color: var(--accent-pink);
        }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-neon));
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: opacity 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        /* Modal Player Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 6, 9, 0.96);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-header {
            width: 100%;
            max-width: 1024px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--accent-neon);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: var(--accent-pink);
        }

        .iframe-container {
            width: 100%;
            max-width: 1024px;
            height: 80vh;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent-neon);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-top: 1px solid rgba(139, 155, 180, 0.1);
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 60px;
        }

        @media(max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .search-container { width: 100%; }
            .hero-banner { flex-direction: column; text-align: center; gap: 20px; }
            .iframe-container { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> NEXUS ARCADE
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search 50 elite games..." onkeyup="filterGames()">
        </div>
    </header>

    <div class="main-container">
        <div class="hero-banner">
            <div class="hero-content">
                <h1>Next-Gen Cloud Gaming</h1>
                <p>Explore an elite catalog of 50 high-performance web games. Zero downloads, instant action, pure arcade adrenaline.</p>
            </div>
            <div class="stats-badge">
                Total Games
                <span id="gameCount">50</span>
            </div>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-bolt"></i> Featured & All Games
        </div>

        <div class="game-grid" id="gameGrid">
            <!-- Dynamic Games will be injected here -->
        </div>
    </div>

    <!-- Game Player Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-header">
            <div class="modal-title" id="modalGameTitle">Playing Game</div>
            <button class="close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="iframe-container">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        &copy; 2026 NexusArcade. All 50 elite titles embedded and optimized for supreme performance.
    </footer>

            { title: "Arcade Master 33", url: "https://html5.gamemonetize.co/th53fdzqzvzoq9bn1caf6uynwf82gx5u/", icon: "fa-display" },
            { title: "Arcade Master 34", url: "https://html5.gamemonetize.co/56bqufae6eplbmeoxa0zex2661phsxyh/", icon: "fa-vr-cardboard" },
            { title: "Arcade Master 35", url: "https://html5.gamemonetize.co/b10mdp1zemecp8chfnvjjh3khq22puth/", icon: "fa-ghost" }
        ];

        function renderGames(list) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            list.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(game.title, game.url);
                
                card.innerHTML = `
                    <div class="game-thumbnail">
                        <i class="fa-solid ${game.icon}"></i>
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <button class="play-btn"><i class="fa-solid fa-play"></i> PLAY NOW</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('gameCount').innerText = list.length;
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(query));
            renderGames(filtered);
        }

        function openGame(title, url) {
            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }

        window.onload = () => {
            renderGames(games);
        };
    </script>
</body>
</html>
